<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTS FAMILY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e2a57;--navy2:#071733;--red:#b3191c;--rt:#b3191c;--bg:#f5f3ee;--sf:#fff;--ink:#14213d;--mu:#5b6678;--ln:#dcd8cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1427;--sf:#101e38;--ink:#eef1f7;--mu:#9aa7bd;--ln:#223455;--rt:#ec4a4d}}
:root[data-theme="dark"]{--bg:#0a1427;--sf:#101e38;--ink:#eef1f7;--mu:#9aa7bd;--ln:#223455;--rt:#ec4a4d}
html{background:var(--navy2);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;line-height:1.8;-webkit-text-size-adjust:100%}
html[lang=en] body{font-family:"Sora","Segoe UI",Helvetica,Arial,sans-serif;line-height:1.65}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #f2a7a8;outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-inline:20px}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,#1b4a8f 0%,var(--navy) 45%,var(--navy2) 100%);color:#fff;padding:20px 0 96px}
.globe{position:absolute;inset-inline-end:-140px;top:40px;width:460px;opacity:.16;animation:spin 120s linear infinite}
.globe *{fill:none;stroke:#fff;stroke-width:1.2}
.globe .arc{stroke:#ff5a5d;stroke-width:5;stroke-linecap:round;stroke-dasharray:90 300;animation:dash 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-780}}
.lang{position:relative;z-index:2;display:flex;justify-content:flex-end;gap:6px}
.lang button{font:inherit;font-size:13px;min-width:44px;min-height:36px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;cursor:pointer;padding:0 12px}
.lang button[aria-pressed=true]{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}
.id{position:relative;z-index:1;text-align:center;margin-top:18px}
.logo{width:178px;height:auto;aspect-ratio:864/740;background:#f5f3ee;border-radius:30px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 6px rgba(179,25,28,.55);object-fit:contain}
.id>*{animation:up .8s both cubic-bezier(.2,.7,.2,1)}
.id>:nth-child(2){animation-delay:.15s}.id>:nth-child(3){animation-delay:.3s}.id>:nth-child(4){animation-delay:.45s}.id>:nth-child(5){animation-delay:.6s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
h1{margin:22px 0 0;font-size:40px;line-height:1.15;font-weight:800;letter-spacing:.5px}
.co{margin:6px 0 0;font-family:"Sora",sans-serif;font-size:14px;color:#c9d6ee;letter-spacing:1px}
.tag{margin:14px auto 0;max-width:30ch;font-size:18px;color:#e8eefb}
.cta{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 24px;border-radius:99px;font-weight:700;font-size:16px;border:2px solid #fff;color:#fff}
.btn.p{background:var(--red);border-color:var(--red)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:#fff;color:var(--navy);border-color:#fff}
.stats{position:relative;z-index:2;margin:-52px auto 0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--sf);border-radius:18px;box-shadow:0 14px 40px rgba(7,23,51,.18);max-width:880px}
.stats div{padding:16px 6px;text-align:center}
.stats div+div{border-inline-start:1px solid var(--ln)}
.stats b{display:block;font-size:26px;color:var(--rt);line-height:1.2;font-family:"Sora",sans-serif}
.stats span{font-size:13px;color:var(--mu)}
.sw{padding-inline:20px;max-width:880px;margin:0 auto}
section{padding:44px 0 0}
h2{margin:0 0 14px;font-size:24px;font-weight:800;color:var(--ink)}
p{margin:0 0 12px;color:var(--ink);max-width:68ch}
.val{border-inline-start:4px solid var(--red);padding:6px 14px;color:var(--mu);margin-top:18px;font-weight:600}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{position:relative;margin:0;overflow:hidden;border-radius:18px;aspect-ratio:1/1.05;background:var(--navy)}
.pc.w{grid-column:1/-1;aspect-ratio:16/9;border-radius:26px 26px 18px 18px}
.pc img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.pc:hover img{transform:scale(1.04)}
.pc figcaption{position:absolute;inset:auto 0 0 0;padding:34px 16px 12px;background:linear-gradient(transparent,rgba(7,23,51,.9));color:#fff;font-weight:700;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
.chips span{border:1.5px solid var(--navy);color:var(--ink);border-radius:99px;padding:3px 14px;font-size:14px}
.chips .x{background:var(--red);border-color:var(--red);color:#fff}
.note{color:var(--mu);font-size:15px}
.srv{list-style:none;margin:0;padding:0}
.srv li{padding:14px 16px;border-inline-start:4px solid var(--red);background:var(--sf);margin-bottom:8px;border-radius:4px 12px 12px 4px;font-weight:600}
[dir=rtl] .srv li{border-radius:12px 4px 4px 12px}
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;min-height:60px}
.row:hover{border-color:var(--rt)}
.bd{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px "Sora",sans-serif}
.bd svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row small{display:block;color:var(--mu);font-size:13px;line-height:1.4}
.row b{font-family:"Sora",sans-serif;font-weight:600;font-size:16px;direction:ltr;unicode-bidi:isolate;display:inline-block}
.close{margin:30px 0 0;padding:24px 20px;border-radius:20px;background:var(--navy);color:#fff;text-align:center;font-weight:600}
footer{margin-top:40px;background:var(--navy2);color:#9fb0cf;text-align:center;padding:22px 20px 26px;font-size:13px;font-family:"Sora",sans-serif}
@media (min-width:720px){h1{font-size:56px}.logo{width:210px}.prods{grid-template-columns:repeat(2,1fr)}.rows{grid-template-columns:1fr 1fr}.srv{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
